server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (repeated per location below only where a location sets its own headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 ws://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build files never change, so browsers may cache them for a long time
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
